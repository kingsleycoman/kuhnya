<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мои рецепты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper:#FBF7F0; --card:#FFF; --accent:#E8541E; --accent-soft:#FBEDE6;
    --ink:#2B2420; --ink-soft:#8A8178; --line:#ECE5DA;
    --green:#5B8C3E; --green-soft:#EDF3E5;
    --warn:#D98324; --warn-soft:#FBF0DF; --danger:#C0392B; --danger-soft:#FBE9E7;
    --radius:18px; --radius-sm:12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased; padding-bottom:88px; }
  .wrap { max-width:720px; margin:0 auto; padding:0 16px; }
  .hidden { display:none !important; }
  .screen { display:none; }
  .screen.active { display:block; }

  /* Header */
  .topbar { display:flex; justify-content:space-between; align-items:center; padding:22px 0 10px; }
  .brand { font-family:'Unbounded',sans-serif; font-weight:700; font-size:23px; letter-spacing:-0.5px; }
  .brand span { color:var(--accent); }
  .profile-btn { display:flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--line);
    border-radius:100px; padding:5px 12px 5px 6px; cursor:pointer; font-size:13px; font-weight:600; }
  .profile-btn .av { width:26px; height:26px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:15px; }

  /* Search */
  .search { position:relative; margin:6px 0 14px; }
  .search input { width:100%; font-family:'Inter',sans-serif; font-size:16px; padding:14px 16px 14px 46px;
    border:1.5px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); outline:none; }
  .search input:focus { border-color:var(--accent); }
  .search-icon { position:absolute; left:15px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; stroke:var(--ink-soft); fill:none; stroke-width:2; }

  /* Filters */
  .filters { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:4px; scrollbar-width:none; }
  .filters::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; font-size:14px; font-weight:500; padding:9px 15px; border:1.5px solid var(--line);
    border-radius:100px; background:var(--card); color:var(--ink); cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:6px; transition:all .12s; }
  .chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.pp.active { background:var(--green); border-color:var(--green); }

  .count { font-size:13px; color:var(--ink-soft); margin:6px 2px 14px; }

  /* Grid */
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:13px; }
  .recipe { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; cursor:pointer; transition:transform .15s,box-shadow .15s; display:flex; flex-direction:column; }
  .recipe:active { transform:scale(.98); }
  .photo { position:relative; aspect-ratio:4/3; background:var(--accent-soft); overflow:hidden; }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .photo .noimg { width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-size:32px; color:var(--accent); opacity:.4; }
  .tab { position:absolute; top:9px; left:9px; font-size:11px; font-weight:600; padding:4px 9px;
    border-radius:100px; background:rgba(255,255,255,.94); color:var(--ink); backdrop-filter:blur(4px); }
  .fav { position:absolute; top:7px; right:7px; width:31px; height:31px; border-radius:50%;
    background:rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; }
  .fav svg { width:16px; height:16px; stroke:var(--accent); fill:none; stroke-width:2; }
  .fav.on svg { fill:var(--accent); }
  .rbody { padding:11px 13px 13px; flex:1; display:flex; flex-direction:column; }
  .rtitle { font-family:'Unbounded',sans-serif; font-weight:600; font-size:13.5px; line-height:1.3;
    letter-spacing:-0.2px; margin-bottom:8px; }
  .rmeta { margin-top:auto; display:flex; flex-wrap:wrap; gap:5px; }
  .pill { font-size:11px; font-weight:500; padding:3px 8px; border-radius:100px; background:var(--paper); color:var(--ink-soft); }
  .pill.pp { background:var(--green-soft); color:var(--green); }
  .pill.kcal { background:var(--accent-soft); color:var(--accent); }

  /* Loading / empty */
  .state { text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:15px; }
  .spinner { width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Bottom nav */
  .nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; justify-content:space-around; padding:9px 0 max(9px,env(safe-area-inset-bottom)); z-index:50; }
  .nav a { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:500;
    color:var(--ink-soft); cursor:pointer; padding:4px 14px; }
  .nav a.active { color:var(--accent); }
  .nav svg { width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:2; }

  /* Card screen */
  .card-gallery { position:relative; }
  .card-main { aspect-ratio:16/10; background:var(--accent-soft); overflow:hidden; }
  .card-main img { width:100%; height:100%; object-fit:cover; }
  .card-main .noimg { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:48px; color:var(--accent); opacity:.4; }
  .iconbtn { position:absolute; top:14px; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.92);
    border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .iconbtn svg { width:19px; height:19px; stroke:var(--ink); fill:none; stroke-width:2; }
  .iconbtn.back { left:14px; } .iconbtn.favc { right:14px; }
  .iconbtn.favc svg { stroke:var(--accent); }
  .iconbtn.favc.on svg { fill:var(--accent); }
  .thumbs { display:flex; gap:8px; padding:10px 16px 0; overflow-x:auto; scrollbar-width:none; }
  .thumbs::-webkit-scrollbar { display:none; }
  .thumbs img { width:60px; height:60px; border-radius:10px; object-fit:cover; cursor:pointer; border:2px solid transparent; flex:0 0 auto; }
  .thumbs img.active { border-color:var(--accent); }
  .photo video, .card-main video { width:100%; height:100%; object-fit:cover; display:block; background:#000; }
  .card-main video { object-fit:contain; }
  .card-main { position:relative; }
  .vnote { position:absolute; left:0; right:0; top:0; padding:12px 116px 16px 64px; font-size:11px; line-height:1.3; text-align:left; color:#fff; background:linear-gradient(rgba(0,0,0,.5),transparent); pointer-events:none; }
  .play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:42px; height:42px; border-radius:50%;
    background:rgba(0,0,0,.45); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; pointer-events:none; }
  .vthumb { width:60px; height:60px; border-radius:10px; flex:0 0 auto; cursor:pointer; border:2px solid transparent;
    background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .vthumb.active { border-color:var(--accent); }
  .card-content.hack .kbzhu, .card-content.hack .kbzhu-label, .card-content.hack .ing-head,
  .card-content.hack .ing, .card-content.hack .actions { display:none; }
  .thumb-add { width:60px; height:60px; border-radius:10px; flex:0 0 auto; cursor:pointer; border:1.5px dashed var(--line);
    background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .thumb-add svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; }
  .card-content { padding:16px; }
  .card-content h1 { font-family:'Unbounded',sans-serif; font-weight:600; font-size:21px; line-height:1.25; letter-spacing:-0.4px; margin-bottom:12px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
  .tag { font-size:12px; font-weight:500; padding:5px 12px; border-radius:100px; background:var(--card); border:1px solid var(--line); color:var(--ink-soft); }
  .tag.pp { background:var(--green-soft); border-color:transparent; color:var(--green); }
  .tag.type { background:var(--accent-soft); border-color:transparent; color:var(--accent); }
  .actions { display:flex; gap:10px; margin-bottom:22px; }
  .btn { flex:1; font-family:'Inter',sans-serif; font-size:15px; font-weight:600; padding:14px; border-radius:14px;
    border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn:active { transform:scale(.97); }
  .btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-second { background:var(--card); color:var(--ink); border:1.5px solid var(--line); }
  .seclabel { font-family:'Unbounded',sans-serif; font-weight:600; font-size:14px; margin-bottom:12px; letter-spacing:-0.2px; }
  .kbzhu { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:22px; }
  .kbzhu-head { display:flex; }
  .kbzhu-tab { flex:1; text-align:center; padding:12px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft); border-bottom:2px solid transparent; }
  .kbzhu-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .kbzhu-grid { display:grid; grid-template-columns:repeat(4,1fr); padding:16px 8px; }
  .kb { text-align:center; } .kb .v { font-family:'Unbounded',sans-serif; font-weight:600; font-size:18px; } .kb .l { font-size:11px; color:var(--ink-soft); margin-top:2px; } .kb.kc .v { color:var(--accent); }
  .ing-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .portion { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:100px; padding:4px; }
  .portion button { width:28px; height:28px; border-radius:50%; border:none; background:var(--paper); cursor:pointer; font-size:16px; color:var(--ink); }
  .portion span { font-size:13px; font-weight:600; min-width:64px; text-align:center; }
  .ing { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:22px; overflow:hidden; }
  .ing-row { display:flex; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); font-size:15px; }
  .ing-row:last-child { border-bottom:none; }
  .ing-row .q { color:var(--ink-soft); font-weight:500; }
  .step { display:flex; gap:13px; margin-bottom:15px; }
  .step-n { flex:0 0 auto; width:29px; height:29px; border-radius:50%; background:var(--accent); color:#fff;
    font-family:'Unbounded',sans-serif; font-weight:600; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .step-t { font-size:15px; line-height:1.55; padding-top:3px; }
  .note { background:var(--accent-soft); border-radius:var(--radius); padding:14px 16px; margin:6px 0 24px; font-size:14px; line-height:1.5; }

  /* Plan */
  .week-nav { display:flex; align-items:center; justify-content:space-between; margin:8px 0 12px; }
  .week-nav .lbl { font-size:14px; font-weight:600; }
  .week-nav button { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  .week-nav svg { width:18px; height:18px; stroke:var(--ink); fill:none; stroke-width:2; }
  .trip { background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:16px; display:flex; align-items:center; gap:10px; font-size:14px; }
  .trip svg { width:18px; height:18px; stroke:var(--accent); fill:none; stroke-width:2; flex:0 0 auto; }
  .trip select { font-family:'Inter',sans-serif; font-size:14px; font-weight:600; border:none; background:transparent; color:var(--accent); cursor:pointer; outline:none; }
  .advisor { border-radius:var(--radius); padding:14px 16px; margin-bottom:16px; font-size:14px; line-height:1.5; }
  .advisor.warn { background:var(--warn-soft); } .advisor.danger { background:var(--danger-soft); }
  .advisor-title { display:flex; align-items:center; gap:8px; font-weight:600; margin-bottom:6px; }
  .advisor.warn .advisor-title { color:var(--warn); } .advisor.danger .advisor-title { color:var(--danger); }
  .advisor svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; }
  .advisor ul { margin:4px 0 0 22px; }
  .day { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; }
  .day.today { border-color:var(--accent); }
  .day-head { padding:13px 16px; border-bottom:1px solid var(--line); }
  .day-name { font-family:'Unbounded',sans-serif; font-weight:600; font-size:15px; }
  .day.today .day-name { color:var(--accent); }
  .day-date { font-size:12px; color:var(--ink-soft); margin-left:8px; font-weight:400; }
  .slot { padding:8px 16px; border-bottom:1px solid var(--line); }
  .slot:last-child { border-bottom:none; }
  .slot-label { font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px; margin:4px 0; }
  .meal { display:flex; align-items:center; gap:10px; padding:7px 0; }
  .meal img { width:40px; height:40px; border-radius:9px; object-fit:cover; flex:0 0 auto; }
  .meal-info { flex:1; min-width:0; } .meal-title { font-size:14px; font-weight:500; }
  .meal-warn { display:flex; align-items:center; gap:5px; font-size:12px; margin-top:3px; }
  .meal-warn.warn { color:var(--warn); } .meal-warn.danger { color:var(--danger); }
  .meal-warn svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; flex:0 0 auto; }
  .meal-del { width:26px; height:26px; border:none; background:transparent; cursor:pointer; color:var(--ink-soft); flex:0 0 auto; }
  .meal-del svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; }
  .add-meal { display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; cursor:pointer; padding:6px 0; }
  .add-meal svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; }
  .cta { position:fixed; bottom:72px; left:0; right:0; display:flex; justify-content:center; padding:0 16px; z-index:40; }
  .cta button { max-width:688px; width:100%; font-size:16px; font-weight:600; padding:15px; border-radius:15px;
    border:none; background:var(--accent); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 6px 20px rgba(232,84,30,.32); }
  .cta button svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2; }

  /* Shopping */
  .toggle { display:flex; background:var(--card); border:1px solid var(--line); border-radius:100px; padding:4px; margin:6px 0 16px; }
  .toggle button { flex:1; font-size:13px; font-weight:600; padding:9px; border:none; background:transparent; color:var(--ink-soft); cursor:pointer; border-radius:100px; }
  .toggle button.active { background:var(--accent); color:#fff; }
  .group { margin-bottom:20px; }
  .group-title { font-family:'Unbounded',sans-serif; font-weight:600; font-size:12px; color:var(--ink-soft); margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
  .group-title.mine { color:var(--accent); }
  .list { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .item { display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:none; }
  .check { width:22px; height:22px; border-radius:7px; border:2px solid var(--line); flex:0 0 auto; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .check.on { background:var(--green); border-color:var(--green); }
  .check svg { width:13px; height:13px; stroke:#fff; fill:none; stroke-width:3; opacity:0; }
  .check.on svg { opacity:1; }
  .item-name { flex:1; font-size:15px; font-weight:500; }
  .item.done .item-name { text-decoration:line-through; color:var(--ink-soft); }
  .item-qty { font-size:14px; font-weight:600; color:var(--accent); }
  .add-row { display:flex; gap:8px; padding:12px 16px; }
  .add-row input { font-family:'Inter',sans-serif; font-size:14px; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; outline:none; }
  .add-row input:focus { border-color:var(--accent); }
  .add-row input.nm { flex:1; } .add-row input.qt { flex:0 0 84px; }
  .add-row button { border:none; background:var(--accent); color:#fff; border-radius:10px; width:42px; cursor:pointer; font-size:20px; }

  /* Modal (profile / recipe picker) */
  .modal { position:fixed; inset:0; background:rgba(43,36,32,.5); z-index:100; display:none; align-items:flex-end; }
  .modal.open { display:flex; }
  .sheet { background:var(--paper); width:100%; max-width:720px; margin:0 auto; border-radius:22px 22px 0 0;
    padding:20px 16px max(20px,env(safe-area-inset-bottom)); max-height:80vh; overflow-y:auto; }
  .sheet h3 { font-family:'Unbounded',sans-serif; font-weight:600; font-size:17px; margin-bottom:16px; }
  .prof-item { display:flex; align-items:center; gap:12px; padding:13px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:8px; cursor:pointer; }
  .prof-item.active { border-color:var(--accent); }
  .prof-item .av { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; }
  .prof-item .nm { font-weight:600; flex:1; }
  .pick-recipe { display:flex; align-items:center; gap:12px; padding:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; cursor:pointer; }
  .pick-recipe img { width:44px; height:44px; border-radius:9px; object-fit:cover; }
  .pick-recipe .noimg { width:44px; height:44px; border-radius:9px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; }
  .toast { position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:11px 18px; border-radius:100px; font-size:14px; font-weight:500; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none; }
  .toast.show { opacity:1; }

  /* Готовим сегодня */
  .today-card { background:var(--accent); color:#fff; border-radius:var(--radius); padding:15px 16px; margin-bottom:16px; cursor:pointer; }
  .today-card .lbl { font-size:12px; font-weight:600; opacity:.85; text-transform:uppercase; letter-spacing:.5px; display:flex; align-items:center; gap:6px; }
  .today-card .lbl svg { width:14px; height:14px; stroke:#fff; fill:none; stroke-width:2; }
  .today-card .meals { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .today-card .tm { font-family:'Unbounded',sans-serif; font-weight:600; font-size:15px; }
  .today-card .ts { font-size:12px; opacity:.85; }

  /* Кнопки-подсказки на плане */
  .hints { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .hint { flex:1; min-width:140px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:12px; cursor:pointer; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; color:var(--ink); }
  .hint:active { transform:scale(.97); } .hint svg { width:18px; height:18px; stroke:var(--accent); fill:none; stroke-width:2; flex:0 0 auto; }

  /* Режим готовки */
  .cook-mode { position:fixed; inset:0; background:var(--paper); z-index:300; display:none; flex-direction:column; padding:max(20px,env(safe-area-inset-top)) 20px 20px; }
  .cook-mode.open { display:flex; }
  .cook-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .cook-head h2 { font-family:'Unbounded',sans-serif; font-size:18px; font-weight:600; flex:1; padding-right:12px; }
  .cook-close { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--card); cursor:pointer; flex:0 0 auto; }
  .cook-close svg { width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:2; }
  .cook-step { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; }
  .cook-step .num { font-family:'Unbounded',sans-serif; font-size:15px; color:var(--accent); font-weight:600; margin-bottom:16px; }
  .cook-step .txt { font-size:24px; line-height:1.4; font-weight:500; }
  .cook-timer { margin:24px auto 0; }
  .cook-timer button { background:var(--accent-soft); color:var(--accent); border:none; border-radius:100px; padding:12px 24px; font-size:16px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-family:'Unbounded',sans-serif; }
  .cook-timer button svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; }
  .cook-nav { display:flex; gap:12px; margin-top:24px; }

  [/^(шт|штук\S*|штуки)\.?$/,'шт'],[/^(зуб\S*)$/,'зубчик'],[/^(веточ\S*|вет\.)$/,'веточка'],[/^(пуч\S*)$/,'пучок'],[/^(щепот\S*)$/,'щепотка'],
  [/^(стакан\S*)$/,'стакан'],[/^(банк\S*)$/,'банка'],[/^(упак\S*|уп\.?|пачк\S*)$/,'упаковка'],[/^(лист\S*)$/,'лист'],[/^(ломт\S*)$/,'ломтик'],[/^(головк\S*|голов\S*)$/,'головка'],[/^(кусоч\S*|кус\S*)$/,'кусок']];
function normUnit(u){ u=(u||'').toLowerCase().replace(/ё/g,'е').trim(); if(!u) return ''; if(/[а-я]/.test(u)) u=u.replace(/l/g,'л'); for(const [re,v] of UNIT_MAP) if(re.test(u)) return v; return u; }
function toBase(q,u){ if(u==='кг') return [q*1000,'г']; if(u==='л') return [q*1000,'мл']; return [q,u]; }
function fmtPart(q,u){
  if(u==='г') return q>=1000?fmtNum(Math.round(q/10)/100)+' кг':Math.round(q)+' г';
  if(u==='мл') return q>=1000?fmtNum(Math.round(q/10)/100)+' л':Math.round(q)+' мл';
  if(['шт','зубчик','банка','упаковка','пучок','головка'].includes(u)) q=Math.ceil(q-1e-9);
  return fmtNum(q)+(u?' '+u:''); }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function fmtQty(q){ if(q==null) return ""; return Number.isInteger(q)?q:Math.round(q*100)/100; }

function isHack(r){ return r.kind==='lifehack'; }

function photoUrl(r){ const ph=(r.recipe_photos||[]).filter(p=>!isVid(p)); return ph.length?(ph.find(p=>p.is_primary)||ph[0]).photo_url:null; }
function videoUrl(r){ const v=(r.recipe_photos||[]).find(isVid); return v?mediaUrl(v.photo_url):null; }
function coverHtml(r){ const img=photoUrl(r); if(img) return `<img src="${img}" loading="lazy" alt="">`;

function sortedMedia(r){ return [...(r.recipe_photos||[])].sort((a,b)=>(isVid(a)-isVid(b))||((b.is_primary?1:0)-(a.is_primary?1:0))); }
function perishDays(name){ const n=(name||"").toLowerCase(); for(const k in PERISHABLE){ if(n.includes(k)) return PERISHABLE[k]; } return 99; }
function recipePerish(r){ let m=99; (r.ingredients||[]).forEach(i=>{ m=Math.min(m,perishDays(i.name)); }); return m; }

function mondayOf(offset){ const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day+offset*7); d.setHours(0,0,0,0); return d; }
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function saveHave(){ try{ localStorage.setItem('have',JSON.stringify(state.have)); }catch(e){} }
function allIngKeys(){
  if(state._keys) return state._keys;
  const cnt={}, lbl={};
  dishes().forEach(r=>(r.ingredients||[]).forEach(i=>{ if(isOptional(i)||inPantry(i)) return; const k=ingKey(i); if(!k||k.length<2) return; cnt[k]=(cnt[k]||0)+1; if(!lbl[k]) lbl[k]=ingLabel(i); }));
  state._keys=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(k=>({k,label:lbl[k],n:cnt[k]}));
  return state._keys;
}
function haveResults(){
  const H=state.have; if(!H.length) return [];
  const out=[];
  dishes().forEach(r=>{ const ings=r.ingredients||[]; if(!ings.length) return;
    let used=0; const miss=[];
    ings.forEach(i=>{ if(H.some(h=>haveMatch(h,i))){ used++; return; } if(isOptional(i)||inPantry(i)) return;
      const nm=ingLabel(i); if(nm&&!miss.some(x=>keyOf(x)===keyOf(nm))) miss.push(nm); });
    if(used&&miss.length<=2) out.push({r,used,miss});
  });
  return out.sort((a,b)=>a.miss.length-b.miss.length||b.used-a.used);
}
function addHave(text){ text=(text||'').trim(); if(!text||!keyOf(text)) return; if(!state.have.some(h=>keyOf(h)===keyOf(text))) state.have.push(text); saveHave(); renderHave(); }
function renderHave(){
  const sel=document.getElementById('haveSel');
  sel.innerHTML=state.have.map((h,i)=>`<span class="opt" data-hi="${i}">${esc(h)} ✕</span>`).join('')+(state.have.length>1?`<span class="opt" id="haveClear" style="background:var(--paper);color:var(--ink-soft)">очистить</span>`:'');
  sel.querySelectorAll('[data-hi]').forEach(el=>el.onclick=()=>{ state.have.splice(+el.dataset.hi,1); saveHave(); renderHave(); });
  const hc=document.getElementById('haveClear'); if(hc) hc.onclick=()=>{ state.have=[]; saveHave(); renderHave(); };
  renderHaveSugg();
  document.getElementById('pantryNote').innerHTML=`Считаю, что дома всегда есть: <b>${esc(state.pantry.join(', '))}</b>${state.pantrySpices?' и все специи':''}. Всё «по вкусу» и «для подачи» не учитываю. <button class="link-btn" id="pantryEdit">Изменить</button>`;
  document.getElementById('pantryEdit').onclick=openPantryEditor;
  const box=document.getElementById('haveRes');

  const res=haveResults();
  if(!res.length){ box.innerHTML=`<div class="state" style="padding:24px 10px">Ничего не подобрал. Добавь ещё продуктов.</div>`; return; }
  const titles=["✅ Можно готовить","Не хватает одного продукта","Не хватает двух продуктов"];
  box.innerHTML=[0,1,2].map(m=>{ const L=res.filter(x=>x.miss.length===m); if(!L.length) return '';
    return `<h4>${titles[m]} · ${L.length}</h4>`+L.map(x=>{ const img=photoUrl(x.r);
      return `<div class="hrow" data-open="${x.r.id}">${img?`<img src="${img}" loading="lazy">`:`<div class="noimg">🍽</div>`}<div class="ht">${esc(x.r.title)}${x.miss.length?`<div class="hm">докупить: ${esc(x.miss.join(', '))}</div>`:''}</div>${x.miss.length?`<button data-buy="${esc(JSON.stringify(x.miss))}">＋ в закупки</button>`:''}</div>`; }).join(''); }).join('');
  box.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openCard(+el.dataset.open));
  box.querySelectorAll('[data-buy]').forEach(b=>b.onclick=async(e)=>{ e.stopPropagation(); await addToMyItems(JSON.parse(b.dataset.buy)); b.textContent='✓ добавлено'; b.disabled=true; });

function renderHaveSugg(){
  const q=norm(document.getElementById('haveInput').value); const taken=new Set(state.have.map(keyOf));
  const L=allIngKeys().filter(x=>!taken.has(x.k)&&(!q||x.k.includes(q)||x.label.toLowerCase().replace(/ё/g,'е').includes(q))).slice(0,q?12:16);

    L.map(x=>`<span class="opt" data-add="${esc(x.label)}">${esc(x.label)}</span>`).join('');
  s.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{ addHave(el.dataset.add); const inp=document.getElementById('haveInput'); inp.value=''; renderHaveSugg(); });
}

async function toggleFav(rid){
  const r=state.recipes.find(x=>x.id===rid); const pid=state.profile?.id; if(!pid) return;
  const existing=(r.recipe_ratings||[]).find(x=>x.profile_id===pid);

  await db.from('recipe_ratings').upsert({recipe_id:rid,profile_id:pid,is_favorite:newVal},{onConflict:'recipe_id,profile_id'});
  if(existing) existing.is_favorite=newVal; else (r.recipe_ratings=r.recipe_ratings||[]).push({recipe_id:rid,profile_id:pid,is_favorite:newVal});
  renderGallery();
}

function openEditor(r){
  const sheet=document.getElementById('sheet'); sheet.classList.add('tall');
  const sel=new Set((r.recipe_tags||[]).map(rt=>rt.tag_id));
  let ings=(r.ingredients||[]).map(i=>({...i}));
  const groups={}; visibleTags().forEach(t=>{ const g=tagGroup(t); (groups[g]=groups[g]||[]).push(t); });
  const gOrder=[...FGROUPS.filter(g=>groups[g]),...Object.keys(groups).filter(g=>!FGROUPS.includes(g))];
  const fts=(!r.food_type||FOOD_TYPES.includes(r.food_type))?FOOD_TYPES:[r.food_type,...FOOD_TYPES];
  const ingRows=()=>ings.map((i,x)=>`<div class="ing-edit"><input class="n" data-f="name" data-i="${x}" value="${esc(i.name)}" placeholder="Продукт"><input class="q" data-f="qty" data-i="${x}" value="${esc(i.qty??'')}" placeholder="кол-во" inputmode="decimal"><input class="u" data-f="unit" data-i="${x}" value="${esc(i.unit||'')}" placeholder="ед."><button data-del="${x}">✕</button></div>`).join('');
  sheet.innerHTML=`<h3>Редактировать</h3>
    <div class="field"><label>Название</label><input id="eTitle" value="${esc(r.title)}"></div>
    <div class="field"><label>Что это</label><select id="eKind"><option value="recipe">Рецепт</option><option value="lifehack" ${isHack(r)?'selected':''}>Лайфхак</option></select></div>
    <div class="field"><label>Главный продукт</label><select id="eFood"><option value="">—</option>${fts.map(f=>`<option ${f===r.food_type?'selected':''}>${esc(f)}</option>`).join('')}</select></div>
    <div class="field"><label>Порций в рецепте</label><input id="eServ" type="number" min="1" max="50" inputmode="numeric" value="${esc(r.servings||'')}"></div>
    ${gOrder.map(g=>`<div class="fgroup"><h4>${esc(g)}</h4><div class="fopts">${groups[g].map(t=>`<span class="opt ${sel.has(t.id)?'on':''}" data-tid="${t.id}">${esc(t.name)}</span>`).join('')}</div></div>`).join('')}
    <div class="field"><label>Ингредиенты</label><div id="eIngs">${ingRows()}</div><button class="link-btn" id="eAddIng">＋ Добавить строку</button></div>
    <div class="field"><label>Приготовление — каждый шаг с новой строки</label><textarea id="eSteps">${esc(r.recipe_text||'')}</textarea></div>
    <div class="field"><label>Заметка автора</label><textarea id="eNotes" style="min-height:70px">${esc(r.notes||'')}</textarea></div>
    <button class="link-btn" id="eHide" style="color:var(--danger)">Скрыть рецепт из приложения</button>
    <div class="sheet-foot"><button class="btn btn-second" id="eCancel">Отмена</button><button class="btn btn-primary" id="eSave">Сохранить</button></div>`;
  const box=document.getElementById('eIngs');
  const bindIngs=()=>{
    box.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ ings[+inp.dataset.i][inp.dataset.f]=inp.value; });
    box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ ings.splice(+b.dataset.del,1); box.innerHTML=ingRows(); bindIngs(); });
  };
  bindIngs();
  document.getElementById('eAddIng').onclick=()=>{ ings.push({name:'',qty:'',unit:''}); box.innerHTML=ingRows(); bindIngs(); box.querySelector('.ing-edit:last-child .n').focus(); };
  sheet.querySelectorAll('[data-tid]').forEach(el=>el.onclick=()=>{ const id=+el.dataset.tid; if(sel.has(id)) sel.delete(id); else sel.add(id); el.classList.toggle('on'); });
  document.getElementById('eCancel').onclick=closeModal;
  document.getElementById('eHide').onclick=async()=>{
    if(!confirm('Скрыть рецепт? Он пропадёт из галереи (из базы не удаляется).')) return;
    const { error }=await db.from('recipes').update({status:'hidden'}).eq('id',r.id);
    if(error){ toast('Не получилось: '+error.message); return; }
    state.recipes=state.recipes.filter(x=>x.id!==r.id); state._keys=null; closeModal(); showScreen('gallery'); toast('Рецепт скрыт');
  };
  document.getElementById('eSave').onclick=async()=>{
    const old=r.ingredients||[];
    const clean=ings.map(i=>{ const name=String(i.name||'').trim(); if(!name) return null;
      const qs=String(i.qty??'').trim().replace(',','.'); let qty=qs===''?null:Number(qs); let unit=String(i.unit||'').trim();
      if(qs!==''&&isNaN(qty)){ unit=unit||qs; qty=null; }
      const o={name,qty,unit}; const prev=old.find(x=>x.name===name); if(prev){ if(prev.base) o.base=prev.base; if(prev.cat) o.cat=prev.cat; }
      return o; }).filter(Boolean);
    const sv=parseInt(document.getElementById('eServ').value,10);
    const upd={ title:prettyTitle(document.getElementById('eTitle').value), kind:document.getElementById('eKind').value,
      food_type:document.getElementById('eFood').value||null, servings:sv>0?sv:null, ingredients:clean,
      recipe_text:document.getElementById('eSteps').value.trim(), notes:document.getElementById('eNotes').value.trim()||null };
    const btn=document.getElementById('eSave'); btn.disabled=true; btn.textContent='Сохраняю…';
    const { error }=await db.from('recipes').update(upd).eq('id',r.id);
    if(error){ btn.disabled=false; btn.textContent='Сохранить'; toast('Не сохранилось: '+error.message); return; }
    const tids=[...sel];
    await db.from('recipe_tags').delete().eq('recipe_id',r.id);
    if(tids.length) await db.from('recipe_tags').insert(tids.map(t=>({recipe_id:r.id,tag_id:t})));
    Object.assign(r,upd); r.recipe_tags=tids.map(t=>({tag_id:t})); state._keys=null;
    if(cardState.portions&&upd.servings&&!r._portionsTouched) cardState.portions=upd.servings;
    closeModal(); renderCard(); toast('Сохранено ✓');
  };
  openModal();
}

async function markCooked(r){
  const now=new Date().toISOString();
  await db.from('recipes').update({last_cooked_at:now, cook_count:(r.cook_count||0)+1}).eq('id',r.id);
  r.last_cooked_at=now; r.cook_count=(r.cook_count||0)+1; toast("Отмечено: приготовил ✓");
}

async function uploadPhoto(e,r){
  const file=e.target.files[0]; if(!file) return;
  toast("Загружаю фото…");
  const path=`${r.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;
  const { error }=await db.storage.from('recipe-photos').upload(path,file);
  if(error){ toast("Ошибка загрузки"); console.error(error); return; }
  const { data:{publicUrl} }=db.storage.from('recipe-photos').getPublicUrl(path);
  const isPrimary=!(r.recipe_photos&&r.recipe_photos.length);
  await db.from('recipe_photos').insert({recipe_id:r.id,photo_url:publicUrl,is_primary:isPrimary});
  r.recipe_photos=r.recipe_photos||[]; r.recipe_photos.push({recipe_id:r.id,photo_url:publicUrl,is_primary:isPrimary});
  toast("Фото добавлено ✓"); renderCard();
}

function forEachPlanMeal(fn){ Object.values(state.plan).forEach(day=>Object.values(day).forEach(arr=>arr.forEach(fn))); }
async function loadPlan(){
  const monday=mondayOf(state.weekOffset); const dates=[...Array(7)].map((_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);return dateKey(d);});
  const { data }=await db.from('meal_plan').select('*, recipes(id,title,servings,ingredients,recipe_photos(photo_url,is_primary,media_type))')
    .gte('plan_date',dates[0]).lte('plan_date',dates[6]).order('id');
  state.plan={}; state.planById={};
  (data||[]).forEach(mp=>{ if(!mp.recipes) return; mp.recipes.title=prettyTitle(mp.recipes.title);
    const m={id:mp.id, recipe:mp.recipes, servings:mp.servings||mp.recipes.servings||2};
    const d=(state.plan[mp.plan_date]=state.plan[mp.plan_date]||{}); (d[mp.meal_slot]=d[mp.meal_slot]||[]).push(m); state.planById[m.id]=m; });
}

function renderPlan(){
  const monday=mondayOf(state.weekOffset);
  const dates=[...Array(7)].map((_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);return d;});
  const today=dateKey(new Date());
  document.getElementById('weekLabel').textContent= state.weekOffset===0?"Эта неделя":state.weekOffset===1?"Следующая неделя":state.weekOffset===-1?"Прошлая неделя":`${dates[0].getDate()}.${dates[0].getMonth()+1} – ${dates[6].getDate()}.${dates[6].getMonth()+1}`;
  const sel=document.getElementById('tripDay');
  if(sel.options.length!==7){ sel.innerHTML=DAYS.map((d,i)=>`<option value="${i}">${d.toLowerCase()}</option>`).join(''); sel.value=state.tripDay; }
  renderAdvisor(dates,today);
  document.getElementById('days').innerHTML=dates.map((d,idx)=>{
    const key=dateKey(d); const dayPlan=state.plan[key]||{}; const isToday=key===today;
    const slots=SLOTS.map(([sk,sl])=>{
      const meals=(dayPlan[sk]||[]).map(m=>{
        const img=photoUrl(m.recipe);
        const pd=recipePerish(m.recipe); const gap=idx-state.tripDay; let warn="";
        if(gap>=0&&pd<99&&gap>pd){ const lvl=gap-pd>=2?"danger":"warn"; warn=`<div class="meal-warn ${lvl}"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>может не дожить</div>`; }
        return `<div class="meal"><div>${img?`<img src="${img}">`:''}</div><div class="meal-info" data-open="${m.recipe.id}"><div class="meal-title">${esc(m.recipe.title)}</div>${warn}
          <div class="mp-por"><button data-ps="${m.id}" data-d="-1">−</button>${m.servings} ${plural(m.servings,['порция','порции','порций'])}<button data-ps="${m.id}" data-d="1">+</button></div></div>
          <button class="meal-del" data-mp="${m.id}"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`;
      }).join('');
      return `<div class="slot"><div class="slot-label">${sl}</div>${meals}<div class="add-meal" data-date="${key}" data-slot="${sk}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>${meals?'Ещё блюдо':'Добавить блюдо'}</div></div>`;
    }).join('');
    return `<div class="day ${isToday?'today':''}"><div class="day-head"><span class="day-name">${DAYS[idx]}</span><span class="day-date">${d.getDate()}.${d.getMonth()+1}</span></div>${slots}</div>`;
  }).join('');
  document.querySelectorAll('.meal-del').forEach(b=>b.onclick=async()=>{ await db.from('meal_plan').delete().eq('id',+b.dataset.mp); await loadPlan(); renderPlan(); });
  document.querySelectorAll('.add-meal').forEach(b=>b.onclick=()=>openRecipePicker(b.dataset.date,b.dataset.slot));
  document.querySelectorAll('#days .meal-info').forEach(el=>el.onclick=()=>{ const r=state.recipes.find(x=>x.id===+el.dataset.open); if(r) openCard(r.id); });
  document.querySelectorAll('#days [data-ps]').forEach(b=>b.onclick=async(e)=>{ e.stopPropagation();
    const m=state.planById[+b.dataset.ps]; if(!m) return; const v=Math.min(30,Math.max(1,m.servings+(+b.dataset.d))); if(v===m.servings) return;
    m.servings=v; renderPlan(); await db.from('meal_plan').update({servings:v}).eq('id',m.id); });
}

function renderAdvisor(dates,today){
  const box=document.getElementById('advisor'); const warns=[];
  dates.forEach((d,idx)=>{ const dp=state.plan[dateKey(d)]||{}; Object.values(dp).forEach(arr=>arr.forEach(m=>{ const pd=recipePerish(m.recipe); const gap=idx-state.tripDay; if(gap>=0&&pd<99&&gap>pd) warns.push({title:m.recipe.title,day:DAYS[idx],gap,lvl:gap-pd>=2?"danger":"warn"}); })); });
  if(!warns.length){ box.innerHTML=""; return; }
  const danger=warns.some(w=>w.lvl==="danger");
  box.innerHTML=`<div class="advisor ${danger?'danger':'warn'}"><div class="advisor-title"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>Консультант по свежести</div>Возможны проблемы со свежестью:<ul>${warns.map(w=>`<li><b>${esc(w.title)}</b> (${w.day}) — скоропортящиеся продукты, купи ближе к готовке.</li>`).join('')}</ul></div>`;
}

function openPlanPicker(r){
  const sheet=document.getElementById('sheet'); const monday=mondayOf(state.weekOffset);

    sheet.innerHTML=`<h3>Куда поставить?</h3><div class="slot-pick">${SLOTS.map(([k,l])=>`<span class="opt ${k===slot?'on':''}" data-sl="${k}">${l}</span>`).join('')}</div>`+

      closeModal(); toast("Добавлено в план ✓"); await loadPlan(); });

}

async function buildShoppingFromPlan(){
  await Promise.all([loadPlan(),loadPantry()]);
  const agg={};
  forEachPlanMeal(m=>{ const rec=m.recipe; if(!rec||!Array.isArray(rec.ingredients)) return;
    const k=(rec.servings&&m.servings)?m.servings/rec.servings:1;
    rec.ingredients.forEach(i=>{ const key=ingKey(i); if(!key) return;
      const a=agg[key]=agg[key]||{name:ingLabel(i),parts:{},taste:false,from:[],cat:null,pantry:true};
      a.pantry=a.pantry&&inPantry(i); if(!a.cat&&i.cat) a.cat=i.cat;
      const q=Number(i.qty);
      if(i.qty==null||i.qty===''||isNaN(q)||q<=0) a.taste=true;
      else { const [bq,bu]=toBase(q*k,normUnit(i.unit)); a.parts[bu]=(a.parts[bu]||0)+bq; }
      if(rec.title&&!a.from.includes(rec.title)) a.from.push(rec.title);
    });
  });
  state.shopItems=Object.values(agg).map(a=>{
    const parts=Object.entries(a.parts).map(([u,q])=>fmtPart(q,u));
    return {name:a.name, qtyText:parts.length?parts.join(' + '):'по вкусу', cat:a.pantry?HOME_CAT:(a.cat||catOf(a.name)), from:a.from, done:false, home:false};
  }).sort((x,y)=>x.name.localeCompare(y.name,'ru'));
  await saveShoppingList();
  showScreen('shop');
}
function catOf(name){ const n=(name||'').toLowerCase().replace(/ё/g,'е');
  if(/лосос|форел|треск|рыб|тунц|тунец|скумбри|сельд|креветк|кальмар|миди|икр|краб|судак|дорад|сибас|минта|хек|семг/.test(n)) return "Рыба и морепродукты";
  if(/куриц|курин|индейк|говяд|телят|свин|фарш|бекон|ветчин|колбас|сосиск|баранин|мясо|грудк|бедр|окорок|печен/.test(n)) return "Мясо и птица";
  if(/масло слив|яйц|яйко|желт(ок|ки)|сливк|молок|сыр|творог|сметан|йогурт|кефир|ряженк|моцарел|пармезан|рикот|маскарпон|брынз|фета/.test(n)) return "Молочное и яйца";
  if(/яблок|банан|ягод|клубник|малин|черник|груш|апельсин|мандарин|лимон|лайм|ревен|вишн|смородин|персик|абрикос|изюм|финик|кураг|чернослив|киви|манго|ананас/.test(n)) return "Фрукты и ягоды";
  if(/соль|специ|паприк|куркум|кориандр|зира|корица|ванил|мускат|приправ|орегано|тимьян|розмарин|лавров|перец (черн|бел|душист|молот|чили молот)|(черн|бел|душист)\S* перец|хмели/.test(n)) return "Специи и приправы";
  if(/перец|лук|кабач|помидор|томат|огур|авокадо|зелен|базилик|укроп|кинз|петруш|чеснок|морков|картоф|капуст|салат|шпинат|баклажан|свекл|тыкв|гриб|шампиньон|сельдер|редис|руккол|имбир|брокколи/.test(n)) return "Овощи и зелень";
  if(/соус|масло|уксус|майонез|кетчуп|горчиц/.test(n)) return "Соусы и масла";
  return "Бакалея"; }

function renderShopping(){
  const c=document.getElementById('shopContent');
  let html="";
  if(!state.shopItems.length && !state.myItems.length){ html=`<div class="state">Список пуст. Собери его из плана недели (кнопка внизу плана).</div>`; }
  else { html+=`<button class="share-btn" id="shareBtn"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Поделиться списком</button>`; }
  const main=state.shopItems.filter(x=>x.cat!==HOME_CAT), home=state.shopItems.filter(x=>x.cat===HOME_CAT);
  if(state.shopMode==="grouped"){
    const present=[...new Set(main.map(x=>x.cat))]; const order=[...ING_CATS,"Рыба и мясо","Молочное","Бакалея и прочее"];
    [...order.filter(x=>present.includes(x)),...present.filter(x=>!order.includes(x))].forEach(cat=>{ const items=main.filter(x=>x.cat===cat);
      html+=`<div class="group"><div class="group-title">${esc(cat)}</div><div class="list">${items.map(it=>shopRow(it,'shop')).join('')}</div></div>`; });
  } else if(main.length){
    html+=`<div class="group"><div class="list">${main.map(it=>shopRow(it,'shop')).join('')}</div></div>`;
  }
  if(home.length) html+=`<div class="group"><div class="group-title pantry-t">🏠 ${HOME_CAT} — проверь</div><div class="list">${home.map(it=>shopRow(it,'shop')).join('')}</div></div>`;
  html+=`<div class="group"><div class="group-title mine">＋ Моё (вручную)</div><div class="list">${state.myItems.map(it=>shopRow(it,'my')).join('')}<div class="add-row"><input class="nm" id="newName" placeholder="Добавить продукт…"><input class="qt" id="newQty" placeholder="кол-во"><button id="addMy">＋</button></div></div></div>`;
  c.innerHTML=html;
  c.querySelectorAll('.check').forEach(ch=>ch.onclick=()=>{ const arr=ch.dataset.list==='shop'?state.shopItems:state.myItems; arr[+ch.dataset.i].done=!arr[+ch.dataset.i].done; saveShoppingList(); renderShopping(); });
  c.querySelectorAll('.home-toggle').forEach(h=>h.onclick=()=>{ state.shopItems[+h.dataset.i].home=!state.shopItems[+h.dataset.i].home; saveShoppingList(); renderShopping(); });
  const add=document.getElementById('addMy'); if(add) add.onclick=()=>{ const n=document.getElementById('newName').value.trim(); const q=document.getElementById('newQty').value.trim(); if(!n)return; state.myItems.push({name:n,qty:q,unit:'',done:false,manual:true}); saveShoppingList(); renderShopping(); };
  const sh=document.getElementById('shareBtn'); if(sh) sh.onclick=shareShopping;
}
function shopRow(it,list){ const idx=(list==='shop'?state.shopItems:state.myItems).indexOf(it);
  const qty=it.manual?(it.qty||''):(it.qtyText||'');
  const from=it.from&&it.from.length>1?`<span style="font-size:11px;color:var(--ink-soft);display:block">${esc([...new Set(it.from)].join(' + '))}</span>`:'';
  const homeBtn=list==='shop'?`<span class="home-toggle ${it.home?'on':''}" data-i="${idx}">${it.home?'✓ есть дома':'есть дома'}</span>`:'';
  return `<div class="item ${it.done?'done':''} ${it.home?'home':''}"><div class="check ${it.done?'on':''}" data-list="${list}" data-i="${idx}"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div><div class="item-name">${esc(it.name)}${from}</div>${homeBtn}<div class="item-qty">${esc(qty)}</div></div>`;
}

// ============ РЕЖИМ ГОТОВКИ + ТАЙМЕРЫ ============
let cookSteps=[], cookIdx=0, cookTitle="";
function parseSteps(r){ return (r.recipe_text||"").split("\n").map(s=>s.replace(/^\s*\d+[\.\)]\s*/,'').trim()).filter(Boolean); }
function stepTimerMin(text){ const m=text.match(/(\d+)(?:\s*[-–]\s*(\d+))?\s*мин/i); if(m) return m[2]?+m[2]:+m[1]; const h=text.match(/(\d+)\s*час/i); if(h) return +h[1]*60; return null; }

function openCookMode(r){
  cookSteps=parseSteps(r); cookIdx=0; cookTitle=r.title||'Готовка';
  if(!cookSteps.length){ toast("У рецепта нет пошаговых инструкций"); return; }
  if(navigator.wakeLock){ navigator.wakeLock.request('screen').then(l=>{window._wakeLock=l;}).catch(()=>{}); }
  document.getElementById('cookMode').classList.add('open');
  renderCookStep();
}
function renderCookStep(){
  document.getElementById('cookTitle').textContent=cookTitle;
  document.getElementById('cookNum').textContent=`Шаг ${cookIdx+1} из ${cookSteps.length}`;
  document.getElementById('cookTxt').textContent=cookSteps[cookIdx];
  const tmin=stepTimerMin(cookSteps[cookIdx]); const tw=document.getElementById('cookTimerWrap');
  tw.innerHTML = tmin ? `<button id="cookTimerBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Таймер ${tmin} мин</button>` : '';
  if(tmin){ document.getElementById('cookTimerBtn').onclick=()=>startTimer(tmin); }
  document.getElementById('cookPrev').style.visibility=cookIdx>0?'visible':'hidden';
  document.getElementById('cookNext').textContent=cookIdx<cookSteps.length-1?'Дальше →':'Готово ✓';
}
function closeCookMode(){ document.getElementById('cookMode').classList.remove('open'); if(window._wakeLock){ window._wakeLock.release(); window._wakeLock=null; } }
function startTimer(min){
  toast(`Таймер на ${min} мин запущен`);
  setTimeout(()=>{ try{ new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play(); }catch(e){}
    alert(`⏰ Время вышло! (${min} мин)\n\n${cookTitle}`); }, min*60*1000);
}

function planHintOld(){

function planHintRandom(){

  const r=d[Math.floor(Math.random()*d.length)];
  openPlanPicker(r); toast(`Случайный выбор: ${r.title}`);
}

// ============ РЕЙТИНГ И ЗАМЕТКА (в карточке) ============
async function setRating(r,stars){
  const pid=state.profile?.id; if(!pid) return;
  await db.from('recipe_ratings').upsert({recipe_id:r.id,profile_id:pid,stars},{onConflict:'recipe_id,profile_id'});
  const ex=(r.recipe_ratings||[]).find(x=>x.profile_id===pid);
  if(ex) ex.stars=stars; else (r.recipe_ratings=r.recipe_ratings||[]).push({recipe_id:r.id,profile_id:pid,stars});
  renderCard();
}
let noteTimer=null;
async function saveNote(r,text){
  const pid=state.profile?.id; if(!pid) return;
  clearTimeout(noteTimer);
  noteTimer=setTimeout(async()=>{
    await db.from('recipe_ratings').upsert({recipe_id:r.id,profile_id:pid,note:text},{onConflict:'recipe_id,profile_id'});
    const ex=(r.recipe_ratings||[]).find(x=>x.profile_id===pid);
    if(ex) ex.note=text; else (r.recipe_ratings=r.recipe_ratings||[]).push({recipe_id:r.id,profile_id:pid,note:text});
    toast("Заметка сохранена ✓");
  },800);
}
function myRating(r){ return (r.recipe_ratings||[]).find(x=>x.profile_id===state.profile?.id)||{}; }

async function loadFamily(){
  const { data }=await db.from('wishes').select('*, profiles(name,emoji,color), recipes(title)').order('created_at',{ascending:false});

// ============ СОХРАНЕНИЕ / ЗАГРУЗКА АКТИВНОГО СПИСКА ============
async function getActiveRun(){
  let { data }=await db.from('shopping_runs').select('*').eq('is_active',true).limit(1);
  if(data&&data.length) return data[0];
  const ins=await db.from('shopping_runs').insert({title:'Текущая закупка',is_active:true}).select();
  return ins.data?ins.data[0]:null;
}
async function saveShoppingList(){
  const run=await getActiveRun(); if(!run) return;
  await db.from('shopping_list').delete().eq('list_id',run.id);
  const rows=[
    ...state.shopItems.map(it=>({list_id:run.id,item_name:it.name,qty:null,unit:it.qtyText||'',category:it.cat,source:'recipe',from_recipes:(it.from||[]).join(' + '),is_checked:it.done,have_at_home:it.home||false})),
    ...state.myItems.map(it=>({list_id:run.id,item_name:it.name,qty:null,unit:it.qty||'',category:'Моё',source:'manual',is_checked:it.done,have_at_home:false}))
  ];
  if(rows.length) await db.from('shopping_list').insert(rows);
}
async function loadShoppingList(){
  const run=await getActiveRun(); if(!run) return false;
  const { data }=await db.from('shopping_list').select('*').eq('list_id',run.id).order('id');
  if(!data||!data.length) return false;
  const qt=x=>x.qty!=null?`${fmtNum(+x.qty)} ${x.unit||''}`.trim():(x.unit||'');
  state.shopItems=data.filter(x=>x.source==='recipe').map(x=>({name:x.item_name,qtyText:qt(x),cat:x.category||catOf(x.item_name),from:x.from_recipes?x.from_recipes.split(' + '):[],done:x.is_checked,home:x.have_at_home}));
  state.myItems=data.filter(x=>x.source==='manual').map(x=>({name:x.item_name,qty:qt(x),unit:'',done:x.is_checked,manual:true}));
  return true;
}

// ============ ПОДЕЛИТЬСЯ СПИСКОМ ============
function shareShopping(){
  const lines=["🛒 Список покупок:",""];
  const active=state.shopItems.filter(i=>!i.home&&!i.done&&i.cat!==HOME_CAT);
  const byCat={};
  active.forEach(i=>{ (byCat[i.cat]=byCat[i.cat]||[]).push(i); });
  Object.keys(byCat).forEach(cat=>{
    lines.push(cat+":");
    byCat[cat].forEach(i=>lines.push(`• ${i.name}${i.qtyText?' — '+i.qtyText:''}`));
    lines.push("");
  });
  const my=state.myItems.filter(i=>!i.done);
  if(my.length){ lines.push("Ещё:"); my.forEach(i=>lines.push(`• ${i.name}${i.qty?' — '+i.qty:''}`)); lines.push(""); }
  const chk=state.shopItems.filter(i=>i.cat===HOME_CAT&&!i.home&&!i.done);
  if(chk.length) lines.push("Проверь дома: "+chk.map(i=>i.name.toLowerCase()).join(', '));
  const text=lines.join("\n").trim();
  if(navigator.share){ navigator.share({title:'Список покупок',text}).catch(()=>{}); }
  else { navigator.clipboard.writeText(text).then(()=>toast("Список скопирован ✓")); }
}

// ============ НАВИГАЦИЯ ============
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.screen===name));
  window.scrollTo(0,0);
  if(name==='plan'){ loadPlan().then(renderPlan); }
  if(name==='family'){ renderFamily(); }
  if(name==='gallery'){ renderGallery(); }
  if(name==='shop'){ loadShoppingList().then(loaded=>{ renderShopping(); }); }
  if(name==='have'){ renderHave(); }
}
function openModal(){ document.getElementById('modal').classList.add('open'); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); document.getElementById('sheet').classList.remove('tall'); }

document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>showScreen(a.dataset.screen));

document.getElementById('haveBack').onclick=()=>showScreen('gallery');

document.getElementById('profileBtn').onclick=()=>{ showScreen('family'); };
document.getElementById('weekPrev').onclick=()=>{ state.weekOffset--; loadPlan().then(renderPlan); };
document.getElementById('weekNext').onclick=()=>{ state.weekOffset++; loadPlan().then(renderPlan); };
document.getElementById('tripDay').onchange=(e)=>{ state.tripDay=+e.target.value; renderPlan(); };
document.getElementById('buildShopping').onclick=buildShoppingFromPlan;
// режим готовки
document.getElementById('cookClose').onclick=closeCookMode;
document.getElementById('cookPrev').onclick=()=>{ if(cookIdx>0){cookIdx--; renderCookStep();} };
document.getElementById('cookNext').onclick=()=>{ if(cookIdx<cookSteps.length-1){cookIdx++; renderCookStep();} else closeCookMode(); };
// подсказки плана
document.getElementById('hintOld').onclick=planHintOld;
document.getElementById('hintRandom').onclick=planHintRandom;
document.querySelectorAll('#screen-shop .toggle button').forEach(b=>b.onclick=()=>{ state.shopMode=b.dataset.mode; document.querySelectorAll('#screen-shop .toggle button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderShopping(); });
